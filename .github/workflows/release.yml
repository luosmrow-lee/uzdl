# Builds the Windows package and, for a v* tag, publishes it as a GitHub
# release with the top CHANGELOG entry as the notes. A manual run only
# builds and keeps the zip as a workflow artifact, for trying the pipeline
# without cutting a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build and package
        run: cmake --build build --config Release --target dist

      - name: Release notes from the top CHANGELOG entry
        id: notes
        run: |
          $lines = Get-Content CHANGELOG
          $entry = New-Object System.Collections.Generic.List[string]
          $started = $false
          foreach ($line in $lines) {
            if ($line -match '^\d{4}-\d{2}-\d{2}') {
              if ($started) { break }
              $started = $true
              continue
            }
            if ($started) {
              # Tab-indented plain text into a nested Markdown list.
              $entry.Add(($line -replace '^\t\t', '  ' -replace '^\t', ''))
            }
          }
          $entry | Set-Content notes.md -Encoding utf8
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "title=uZDL $version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Keep the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: uZDL-win64
          path: build/dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: build/dist/*.zip
